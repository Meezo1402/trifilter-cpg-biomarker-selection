name: smoke-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("caret", "randomForest", "kernlab", "pROC", "e1071", "testthat"))'
      - name: Unit tests
        run: Rscript tests/testthat.R
      - name: Run the pipeline on a tiny synthetic cohort
        run: Rscript scripts/run_pipeline.R --smoke
      - name: Show summary
        run: cat results/smoke/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/smoke
